<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPCMS — Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #1e293b;
            border-radius: 16px;
            padding: 48px 40px;
            width: 420px;
            border: 1px solid #334155;
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo h1 { color: #60a5fa; font-size: 28px; font-weight: 700; }
        .logo p { color: #94a3b8; font-size: 13px; margin-top: 6px; }
        .badge {
            display: inline-block;
            background: #1d4ed8;
            color: #bfdbfe;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 20px;
            margin-top: 8px;
        }
        label {
            display: block;
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 6px;
            margin-top: 20px;
        }
        input, select {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        input:focus, select:focus { border-color: #60a5fa; }
        .btn {
            width: 100%;
            padding: 13px;
            margin-top: 28px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #1d4ed8; }
        .error {
            color: #f87171;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
            display: none;
            background: #1a0000;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #f87171;
        }
       
        .password-wrap { position: relative; }
        .toggle-pwd {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 13px;
            padding: 0;
        }
        .loading { display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <h1>🛡️ DPCMS</h1>
            <p>Data Privacy & Consent Management</p>
            <span class="badge">GDPR + CCPA Compliant</span>
        </div>

        <label>Email Address</label>
        <input type="email" id="email" placeholder="Enter your email"/>

        <label>Password</label>
        <div class="password-wrap">
            <input type="password" id="password" placeholder="Enter your password"/>
            <button class="toggle-pwd" onclick="togglePassword()">👁</button>
        </div>

        <label>Login As</label>
        <select id="role">
            <option value="USER">User</option>
            <option value="ADMIN">Admin</option>
            <option value="DPO">Data Protection Officer</option>
        </select>

        <button class="btn" onclick="login()">
            <span class="loading" id="loading">Logging in...</span>
            <span id="btnText">Sign In</span>
        </button>

        <p class="error" id="error">Invalid credentials</p>

      

        <div class="footer"> Protected under GDPR Article 6 & CCPA</div>
    </div>

    <script>
        const API = 'http://localhost:8081';

        function togglePassword() {
            const pwd = document.getElementById('password');
            pwd.type = pwd.type === 'password' ? 'text' : 'password';
        }

       async function login() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const role     = document.getElementById('role').value;
    const errorEl  = document.getElementById('error');
    const btnText  = document.getElementById('btnText');
    const loading  = document.getElementById('loading');

    if (!email || !password) {
        errorEl.textContent = 'Please enter email and password.';
        errorEl.style.display = 'block';
        return;
    }

    btnText.style.display = 'none';
    loading.style.display = 'inline';
    errorEl.style.display = 'none';

    try {
        // Fetch all users and match manually
        const res = await fetch(`http://localhost:8081/api/users`);
        const users = await res.json();

        const user = users.find(u =>
            u.email === email &&
            u.role === role &&
            u.password === password &&
            u.isDeleted === 0
        );

        if (user) {
            localStorage.setItem('dpcms_user', JSON.stringify(user));
            if (user.role === 'USER') {
                window.location.href = 'dashboard.html';
            } else {
                window.location.href = 'admin.html';
            }
        } else {
            errorEl.textContent = 'Invalid email, password or role.';
            errorEl.style.display = 'block';
        }

    } catch (e) {
        errorEl.textContent = 'Cannot connect to server. Make sure backend is running on port 8081.';
        errorEl.style.display = 'block';
    }

    btnText.style.display = 'inline';
    loading.style.display = 'none';
}

        // Allow pressing Enter to login
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
